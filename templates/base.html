<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}HostelPro{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0f1e;
  --surface:  #111827;
  --card:     #1a2235;
  --border:   #1e3a5f;
  --accent:   #3b82f6;
  --accent2:  #6366f1;
  --green:    #22c55e;
  --red:      #f43f5e;
  --yellow:   #f59e0b;
  --text:     #e2e8f0;
  --muted:    #64748b;
  --mono:     'Space Mono', monospace;
  --sans:     'DM Sans', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }

/* NAV */
nav {
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 2rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:60px;
  position:sticky; top:0; z-index:100;
}
.nav-brand { font-family:var(--mono); font-size:1.1rem; color:var(--accent); letter-spacing:2px; text-decoration:none; }
.nav-brand span { color:var(--text); }
.nav-links { display:flex; gap:1.5rem; align-items:center; }
.nav-links a { color:var(--muted); text-decoration:none; font-size:.875rem; font-weight:500; transition:.2s; }
.nav-links a:hover { color:var(--text); }
.nav-badge { background:var(--accent); color:#fff; font-size:.65rem; font-family:var(--mono); padding:2px 8px; border-radius:2px; text-decoration:none; }

/* CONTAINER */
.container { max-width:1280px; margin:0 auto; padding:2rem; }

/* CARDS */
.card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  padding:1.5rem;
  margin-bottom:1.5rem;
}
.card-title {
  font-family:var(--mono);
  font-size:.75rem;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--accent);
  margin-bottom:1rem;
  padding-bottom:.75rem;
  border-bottom:1px solid var(--border);
}

/* STAT CARDS */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:2rem; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1.25rem; }
.stat-card .label { font-size:.7rem; font-family:var(--mono); letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
.stat-card .value { font-size:2rem; font-family:var(--mono); font-weight:700; margin:.25rem 0; }
.stat-card .sub { font-size:.75rem; color:var(--muted); }
.stat-blue  .value { color:var(--accent); }
.stat-green .value { color:var(--green); }
.stat-red   .value { color:var(--red); }
.stat-yellow .value { color:var(--yellow); }

/* FORMS */
input, select, textarea {
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:.65rem 1rem;
  border-radius:6px;
  font-family:var(--sans);
  font-size:.9rem;
  width:100%;
  transition:.2s;
}
input:focus, select:focus, textarea:focus {
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(59,130,246,.1);
}
label { font-size:.8rem; font-weight:500; color:var(--muted); display:block; margin-bottom:.35rem; text-transform:uppercase; letter-spacing:.5px; }
.form-group { margin-bottom:1rem; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }

/* BUTTONS */
.btn {
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  padding:.6rem 1.25rem;
  border-radius:6px;
  border:none;
  cursor:pointer;
  font-family:var(--sans);
  font-size:.85rem;
  font-weight:600;
  text-decoration:none;
  transition:.2s;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#2563eb; }
.btn-success { background:var(--green); color:#000; }
.btn-danger  { background:var(--red);  color:#fff; }
.btn-warning { background:var(--yellow); color:#000; }
.btn-ghost   { background:transparent; color:var(--muted); border:1px solid var(--border); }
.btn-ghost:hover { color:var(--text); border-color:var(--muted); }
.btn-sm { padding:.35rem .75rem; font-size:.75rem; }
.btn-full { width:100%; justify-content:center; }

/* BADGES */
.badge { display:inline-block; font-size:.65rem; font-family:var(--mono); padding:2px 8px; border-radius:3px; text-transform:uppercase; letter-spacing:1px; }
.badge-green  { background:rgba(34,197,94,.15); color:var(--green); border:1px solid rgba(34,197,94,.3); }
.badge-red    { background:rgba(244,63,94,.15);  color:var(--red);   border:1px solid rgba(244,63,94,.3); }
.badge-yellow { background:rgba(245,158,11,.15); color:var(--yellow);border:1px solid rgba(245,158,11,.3); }
.badge-blue   { background:rgba(59,130,246,.15); color:var(--accent);border:1px solid rgba(59,130,246,.3); }
.badge-gray   { background:rgba(100,116,139,.15);color:var(--muted); border:1px solid rgba(100,116,139,.3); }

/* TABLES */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
th { font-family:var(--mono); font-size:.65rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); padding:.65rem 1rem; text-align:left; border-bottom:1px solid var(--border); }
td { padding:.75rem 1rem; border-bottom:1px solid rgba(30,58,95,.4); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:rgba(30,58,95,.3); }

/* ALERTS */
.alert { padding:.85rem 1.25rem; border-radius:6px; font-size:.875rem; margin-bottom:1rem; }
.alert-success { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3); color:var(--green); }
.alert-error   { background:rgba(244,63,94,.1);  border:1px solid rgba(244,63,94,.3);  color:var(--red); }
.alert-info    { background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.3); color:var(--accent); }
.alert-warning { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); color:var(--yellow); }

/* TABS */
.tabs { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:0; }
.tab {
  padding:.65rem 1.25rem;
  border:none;
  background:transparent;
  color:var(--muted);
  font-family:var(--mono);
  font-size:.7rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:.2s;
}
.tab.active, .tab:hover { color:var(--accent); border-bottom-color:var(--accent); }

/* TAB CONTENT */
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* GRID */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }

/* EMPTY STATE */
.empty { text-align:center; padding:2.5rem 1rem; color:var(--muted); font-size:.875rem; font-family:var(--mono); }

/* MODAL */
.modal-overlay {
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,.7);
  z-index:1000;
  align-items:center;
  justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:2rem;
  width:min(480px,90vw);
  max-height:85vh;
  overflow-y:auto;
}
.modal-title {
  font-family:var(--mono);
  font-size:.8rem;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--accent);
  margin-bottom:1.5rem;
}

/* SCROLLBAR */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }

@media(max-width:768px) {
  .container { padding:1rem; }
  .grid-2,.grid-3,.form-row { grid-template-columns:1fr; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  nav { padding:0 1rem; }
}
</style>
</head>
<body>
{% block nav %}{% endblock %}
{% block content %}{% endblock %}

<script>
// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const group = tab.closest('.tabs-container') || document;
    const target = tab.dataset.target;
    group.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    group.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    const panel = document.getElementById(target);
    if(panel) panel.classList.add('active');
    if(target) location.hash = '#' + target;
  });
});

// Auto-activate tab from hash
function activateHashTab() {
  const hash = location.hash.replace('#','');
  if(hash) {
    const tab = document.querySelector(`.tab[data-target="${hash}"]`);
    if(tab) tab.click();
  }
}
activateHashTab();

// Modals
document.querySelectorAll('[data-modal]').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.modal;
    document.getElementById(id)?.classList.add('open');
  });
});
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => {
    if(e.target === m) m.classList.remove('open');
  });
});
document.querySelectorAll('[data-close-modal]').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.closest('.modal-overlay')?.classList.remove('open');
  });
});
</script>
</body>
</html>
