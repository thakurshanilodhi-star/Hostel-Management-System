{% extends "base.html" %}
{% block title %}Admin Login — HostelPro{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div style="width:min(400px,100%);">
    <div style="text-align:center;margin-bottom:2.5rem;">
      <div style="font-family:var(--mono);font-size:1.8rem;letter-spacing:4px;color:var(--red);margin-bottom:.5rem;">HOSTEL<span style="color:var(--text);">PRO</span></div>
      <div style="color:var(--muted);font-size:.8rem;letter-spacing:2px;text-transform:uppercase;">Admin Portal</div>
    </div>
    <div class="card">
      <div class="card-title">Admin Sign In</div>
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="admin" required autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-danger btn-full">Sign In as Admin</button>
      </form>
    </div>
    <div style="text-align:center;margin-top:1rem;">
      <a href="/student" style="color:var(--muted);font-size:.8rem;text-decoration:none;">← Student Login</a>
    </div>
  </div>
</div>
{% endblock %}
